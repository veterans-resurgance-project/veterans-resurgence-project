    
        <button onclick="checkStaffAccess()" style="background: rgba(15, 23, 42, 0.6); color: #cbd5e1; padding: 0.9rem 2rem; border-radius: 8px; font-weight: 700; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">
          Staff Inventory Login
        </button>
      </div>
    </div>

    <script>
      function checkStaffAccess() {
        let passcode = prompt("Enter 4-digit staff security passcode:");
        if (passcode === "6060") {
          window.location.href = "staff-portal.html"; 
        } else if (passcode !== null) {
          alert("Incorrect security code. Access denied.");
        }
      }
    </script>
